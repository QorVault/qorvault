# Operator hand counts for the minutes fact layer.
#
# WHY THIS FILE EXISTS
# The parser is checked against itself everywhere else in this package. This is
# the one independent check: a human opens the source PDF, counts the motions
# by eye, and the fixture compares that count to what the parser produced. A
# check the parser cannot influence is the only kind that can catch a parser
# that is confidently wrong.
#
# HOW TO FILL IT IN
# For each meeting below, open the PDF at `pdf_path`, count, and replace the
# `null` values. Leave a value as `null` if you have not counted it yet --
# the fixture stays BLOCKED until every meeting has a motions_total, and it
# will tell you which ones are still missing.
#
#   motions_total     How many distinct motions the minutes record for this
#                     meeting. Count a motion once even if it is amended or
#                     re-stated before the vote.
#   motions_adopted   Of those, how many carried / passed / were adopted.
#   motions_lost      Of those, how many failed / were lost.
#
# The parser's own figures are shown as `parser_*` for context. They are NOT
# the answer -- if your count differs, the parser is what gets investigated,
# not your count.
#
# `parser_*` counts motions sourced from the MINUTES only. Motions sourced from
# BoardDocs agenda items are deliberately excluded: you are counting the PDF in
# front of you, and the agenda-item record is a separate source that records
# the same meeting differently. Mixing them would compare a count of one
# document against a count of two.
#
# Three meetings per format era, per the two eras Phase 0 identified:
#   Era A  "Numbered motion"            2004-08-31 -> 2022-05-11
#   Era B  "Roll call / passive motion" 2022-08-24 -> 2026-02-04
#
# NOTE ON MEETING TYPE
# The three Era A meetings are recorded against a census row typed
# work_study/special rather than regular. The minutes document itself is the
# board meeting minutes for that date and carries motions; the type is a
# census-slug artifact. Count the PDF, not the type. See the fixtures report
# for why no substitute date was proposed.

